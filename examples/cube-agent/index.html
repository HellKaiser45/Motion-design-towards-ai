<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CU-13 · Agent Stage flagship demo</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "agent-stage": "../../src/index.js"
  }
}
</script>
<style>
  :root {
    --panel: rgba(11, 17, 29, 0.62);
    --line: rgba(34, 211, 238, 0.25);
    --ink: #dbe7f3;
    --dim: #8ea3bd;
    --accent: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -10%, #1a2436 0%, #0b1220 55%, #060a12 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .vignette::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,0.6) 100%);
  }
  #stage-wrap {
    position: relative;
    width: min(78vw, 980px);
    height: min(72vh, 620px);
    border-radius: 18px;
    overflow: hidden;
    background:
      radial-gradient(600px 400px at 50% 30%, rgba(34, 211, 238, 0.07), transparent 70%),
      linear-gradient(180deg, #0d1422 0%, #080d18 100%);
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  }
  #stage-wrap.checker {
    background:
      repeating-conic-gradient(#141b2a 0% 25%, #0b111d 0% 50%) 0 0 / 28px 28px;
  }
  #stage { position: absolute; inset: 0; }

  /* glassmorphism panels */
  .panel {
    position: absolute; z-index: 10;
    background: linear-gradient(160deg, rgba(16, 26, 44, 0.72), rgba(9, 14, 25, 0.66));
    border: 1px solid rgba(148, 197, 224, 0.18);
    border-radius: 16px;
    padding: 14px 16px;
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    font-size: 13px;
  }
  #controls { top: 18px; right: 18px; width: 268px; }
  #controls h1 {
    margin: 0 0 10px; font-size: 13px; letter-spacing: 3px;
    color: var(--dim); font-weight: 600;
  }
  #scene-label {
    font-size: 12px; letter-spacing: 2px; color: var(--accent);
    min-height: 16px; margin-bottom: 6px; font-weight: 600;
  }
  .showbarwrap {
    height: 5px; border-radius: 3px; overflow: hidden;
    background: rgba(255, 255, 255, 0.07); margin-bottom: 10px;
  }
  #show-progress {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #22d3ee, #a78bfa);
    transition: width 0.2s linear;
  }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  button {
    font: inherit; color: var(--ink); cursor: pointer;
    background: rgba(34, 211, 238, 0.08);
    border: 1px solid var(--line);
    border-radius: 9px; padding: 6px 10px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  button:hover { background: rgba(34, 211, 238, 0.18); border-color: rgba(34, 211, 238, 0.5); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.3), rgba(167, 139, 250, 0.25));
    font-weight: 600;
    border-color: rgba(34, 211, 238, 0.45);
    box-shadow: 0 0 18px rgba(34, 211, 238, 0.15);
  }
  button.primary:hover { box-shadow: 0 0 26px rgba(34, 211, 238, 0.3); }
  hr { border: none; border-top: 1px solid rgba(148, 197, 224, 0.14); margin: 12px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  select, input {
    font: inherit; color: var(--ink); width: 100%;
    background: rgba(9, 14, 25, 0.8); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px;
  }
  label { color: var(--dim); font-size: 11px; display: block; margin-bottom: 3px; letter-spacing: 1px; }
  .barwrap {
    height: 6px; border-radius: 3px; overflow: hidden;
    background: rgba(255, 255, 255, 0.06); margin: 8px 0 6px;
  }
  #bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }
  #export-status, #caps { color: var(--dim); font-size: 11px; min-height: 14px; }
  #caps { margin-top: 8px; }
</style>
</head>
<body class="vignette">
  <div id="stage-wrap">
    <div id="stage"></div>

    <div class="panel" id="controls">
      <h1>CU-13 CONTROL</h1>
      <div id="scene-label">—</div>
      <div class="showbarwrap"><div id="show-progress"></div></div>
      <div class="btnrow">
        <button id="btn-idle">idle</button>
        <button id="btn-greet">greet</button>
        <button id="btn-think">think</button>
        <button id="btn-speak">speak</button>
        <button id="btn-surprise">surprise</button>
        <button id="btn-dance">dance</button>
      </div>
      <div class="btnrow">
        <button id="btn-show" class="primary">▶ Run show</button>
        <button id="btn-bg" title="Toggle alpha-proofing background">bg ⬗</button>
      </div>
      <hr/>
      <div class="grid">
        <div><label>FORMAT</label>
          <select id="fmt">
            <option value="webm">WebM (alpha)</option>
            <option value="png-seq">PNG sequence</option>
            <option value="mp4">MP4 (flattened)</option>
          </select>
        </div>
        <div><label>FPS</label>
          <select id="fps">
            <option>24</option>
            <option selected>30</option>
            <option>60</option>
          </select>
        </div>
        <div><label>RESOLUTION</label>
          <select id="res">
            <option value="854x480">480p</option>
            <option value="1280x720" selected>720p</option>
            <option value="1920x1080">1080p</option>
          </select>
        </div>
        <div><label>DURATION (S)</label>
          <input id="dur" type="number" min="1" max="60" step="0.5" value="32"/>
        </div>
      </div>
      <button id="btn-export" class="primary" style="width:100%">⬤ Export show</button>
      <button id="btn-cancel" style="width:100%;margin-top:6px">Cancel</button>
      <div class="barwrap"><div id="bar"></div></div>
      <div id="export-status"></div>
      <div id="caps"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
