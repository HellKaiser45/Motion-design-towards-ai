<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!--
    CU-13 face asset v2. Expression groups (opacity driven by packs via WAAPI):
    #m-neutral #m-smile (SMIL morph) #m-grin #m-think #m-talk #m-surprise #m-boot
    #m-wink #m-star #m-heart. CSS keyframes (blink, scan) run on their own
    clock; SMIL uses begin="0s" fill="freeze" for deterministic sync seeking.
  -->
  <style>
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.6s ease-in-out infinite;
    }
    .eye2 { animation-delay: 0.06s; }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      93.5%         { transform: scaleY(0.08); }
      96.5%         { transform: scaleY(1); }
    }
    .scan {
      animation: scanline 1.1s linear infinite;
    }
    @keyframes scanline {
      0%   { transform: translateY(-20px); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateY(120px); opacity: 0; }
    }
    .star-pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: starpop 1.2s ease-in-out infinite;
    }
    .star-pop.s2 { animation-delay: 0.12s; }
    @keyframes starpop {
      0%, 100% { transform: scale(1) rotate(-4deg); }
      50%      { transform: scale(1.22) rotate(6deg); }
    }
  </style>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="screenbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
  </defs>

  <rect width="200" height="140" rx="10" fill="url(#screenbg)"/>

  <g filter="url(#glow)">
    <g class="eye"><rect x="48" y="36" width="22" height="32" rx="10" fill="#22d3ee"/></g>
    <g class="eye eye2"><rect x="130" y="36" width="22" height="32" rx="10" fill="#22d3ee"/></g>
  </g>

  <g id="m-neutral" opacity="1">
    <rect x="84" y="97" width="32" height="6" rx="3" fill="#22d3ee" opacity="0.92"/>
  </g>

  <g id="m-smile" opacity="0">
    <path id="smile-path" d="M70 98 Q100 104 130 98" fill="none" stroke="#22d3ee"
          stroke-width="6" stroke-linecap="round">
      <animate id="smile-morph" attributeName="d" begin="0s" dur="0.5s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1"
               values="M70 98 Q100 104 130 98; M68 92 Q100 122 132 92"/>
    </path>
  </g>

  <g id="m-grin" opacity="0">
    <path d="M72 92 Q100 126 128 92 Q100 106 72 92 Z" fill="#22d3ee" opacity="0.95"/>
    <rect x="78" y="84" width="10" height="5" rx="2.5" fill="#22d3ee" opacity="0.5"/>
    <rect x="112" y="84" width="10" height="5" rx="2.5" fill="#22d3ee" opacity="0.5"/>
  </g>

  <g id="m-think" opacity="0">
    <path d="M76 102 Q88 92 100 101 Q110 108 124 96" fill="none" stroke="#22d3ee"
          stroke-width="6" stroke-linecap="round" opacity="0.92"/>
  </g>

  <g id="m-talk" opacity="0">
    <path id="m-talk-open" d="M86 94 Q100 118 114 94 Q100 104 86 94 Z" fill="#22d3ee" opacity="0"/>
    <path id="m-talk-closed" d="M84 98 Q100 106 116 98" fill="none" stroke="#22d3ee"
          stroke-width="6" stroke-linecap="round" opacity="1"/>
  </g>

  <g id="m-surprise" opacity="0">
    <ellipse cx="100" cy="100" rx="11" ry="13" fill="none" stroke="#22d3ee" stroke-width="6"/>
  </g>

  <g id="m-wink" opacity="0">
    <rect x="126" y="30" width="30" height="44" rx="12" fill="#0b1220"/>
    <path d="M128 52 Q141 44 154 52" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g id="m-star" opacity="0">
    <rect x="44" y="30" width="30" height="44" rx="12" fill="#0b1220"/>
    <rect x="126" y="30" width="30" height="44" rx="12" fill="#0b1220"/>
    <g filter="url(#glow)">
      <path class="star-pop" d="M59 34 L63.2 45.4 L75 45.8 L65.8 53.2 L69.2 64.6 L59 57.6 L48.8 64.6 L52.2 53.2 L43 45.8 L54.8 45.4 Z" fill="#fde047"/>
      <path class="star-pop s2" d="M141 34 L145.2 45.4 L157 45.8 L147.8 53.2 L151.2 64.6 L141 57.6 L130.8 64.6 L134.2 53.2 L125 45.8 L136.8 45.4 Z" fill="#fde047"/>
    </g>
  </g>

  <g id="m-heart" opacity="0">
    <rect x="44" y="30" width="30" height="44" rx="12" fill="#0b1220"/>
    <rect x="126" y="30" width="30" height="44" rx="12" fill="#0b1220"/>
    <g filter="url(#glow)">
      <path class="star-pop" d="M59 64 C48 54 46 44 52 39 C56 36 60 38 59 42 C58 38 62 36 66 39 C72 44 70 54 59 64 Z" fill="#fb7185"/>
      <path class="star-pop s2" d="M141 64 C130 54 128 44 134 39 C138 36 142 38 141 42 C140 38 144 36 148 39 C154 44 152 54 141 64 Z" fill="#fb7185"/>
    </g>
  </g>

  <g id="m-boot" opacity="0">
    <rect x="6" y="10" width="188" height="120" rx="8" fill="#070b14" opacity="0.92"/>
    <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#22d3ee" letter-spacing="2">CU-13 BOOT v2.3</text>
    <text x="20" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" fill="#5f7d9c" letter-spacing="1">loading persona modules…</text>
    <rect x="20" y="72" width="160" height="5" rx="2.5" fill="#12283c"/>
    <rect x="20" y="72" width="104" height="5" rx="2.5" fill="#22d3ee"/>
    <rect class="scan" x="6" y="18" width="188" height="4" fill="#22d3ee" opacity="0.8"/>
  </g>
</svg>
