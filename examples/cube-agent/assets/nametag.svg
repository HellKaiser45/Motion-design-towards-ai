<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56">
  <defs>
    <clipPath id="tag-clip">
      <rect x="30" y="8" width="180" height="40" rx="10"/>
    </clipPath>
  </defs>
  <g id="tag" opacity="1">
    <rect x="1" y="1" width="218" height="54" rx="14" fill="rgba(13,20,33,0.85)"
          stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle cx="26" cy="28" r="6" fill="#34d399"/>
    <circle cx="26" cy="28" r="6" fill="none" stroke="#34d399" stroke-width="2">
      <animate attributeName="r" values="6;13" dur="1.6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.6;0" dur="1.6s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <g clip-path="url(#tag-clip)">
      <text id="tag-text" x="44" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" fill="#dbe7f3" letter-spacing="1">CU-13 · online</text>
      <!-- typewriter cover: slides right to reveal the text, pack-driven -->
      <rect id="cover" x="30" y="6" width="214" height="44" fill="rgba(13,20,33,1)"/>
    </g>
    <!-- blinking caret sits at the end of the typed text -->
    <rect id="cursor" x="146" y="20" width="3" height="16" fill="#22d3ee" opacity="0"/>
  </g>
</svg>
