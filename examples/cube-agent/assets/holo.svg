<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="180" height="200">
  <!--
    Holographic data panel. One asset, three glyph variants (#g-cube,
    #g-bolt, #g-chart); the example mounts it three times and reveals a
    different glyph on each panel. CSS loops run on their own clock; pack
    tracks drive #panel opacity/transform for reveals.
  -->
  <style>
    .holo-scan {
      animation: holoscan 2.4s linear infinite;
    }
    @keyframes holoscan {
      0%   { transform: translateY(0px); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.9; }
      100% { transform: translateY(160px); opacity: 0; }
    }
    .holo-dash {
      animation: holodash 1.6s linear infinite;
    }
    @keyframes holodash {
      to { stroke-dashoffset: -36; }
    }
    .holo-blink {
      animation: holoblink 1.1s steps(2) infinite;
    }
    @keyframes holoblink {
      50% { opacity: 0.25; }
    }
  </style>
  <defs>
    <linearGradient id="hologb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(34,211,238,0.16)"/>
      <stop offset="1" stop-color="rgba(34,211,238,0.02)"/>
    </linearGradient>
    <filter id="hologlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="panel" opacity="0" filter="url(#hologlow)">
    <rect x="2" y="2" width="176" height="196" rx="12" fill="url(#hologb)"
          stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="2" y="2" width="176" height="24" rx="12" fill="rgba(34,211,238,0.12)"/>
    <text x="14" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" fill="#7dd3fc" letter-spacing="3" id="panel-title">MODULE</text>
    <circle class="holo-blink" cx="166" cy="14" r="3.5" fill="#22d3ee"/>
    <rect class="holo-scan" x="4" y="28" width="172" height="3" fill="#22d3ee" opacity="0.5"/>

    <!-- glyph A: wireframe cube -->
    <g id="g-cube">
      <path d="M90 48 L124 66 L124 106 L90 124 L56 106 L56 66 Z"
            fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M90 48 L90 88 L124 106 M90 88 L56 106"
            fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="90" cy="88" r="3" fill="#a5f3fc"/>
    </g>

    <!-- glyph B: energy bolt -->
    <g id="g-bolt" opacity="0">
      <path d="M96 44 L64 100 L86 100 L76 132 L118 82 L94 82 L108 44 Z"
            fill="rgba(34,211,238,0.25)" stroke="#22d3ee" stroke-width="2"
            stroke-linejoin="round"/>
    </g>

    <!-- glyph C: rising chart -->
    <g id="g-chart" opacity="0">
      <polyline class="holo-dash" points="52 120 74 96 92 108 112 74 130 84"
                fill="none" stroke="#22d3ee" stroke-width="2.5"
                stroke-dasharray="6 6" stroke-linecap="round"/>
      <circle cx="130" cy="84" r="4" fill="#a5f3fc"/>
      <rect x="56" y="132" width="12" height="10" fill="rgba(34,211,238,0.4)"/>
      <rect x="76" y="126" width="12" height="16" fill="rgba(34,211,238,0.55)"/>
      <rect x="96" y="118" width="12" height="24" fill="rgba(34,211,238,0.7)"/>
      <rect x="116" y="110" width="12" height="32" fill="rgba(34,211,238,0.85)"/>
    </g>

    <!-- generic telemetry rows shared by all glyphs -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5"
       fill="#7dd3fc" letter-spacing="1">
      <text x="14" y="152">LINK ......... OK</text>
      <text x="14" y="168">CORE ........ 98%</text>
      <text x="14" y="184">MEM ....... 64/128</text>
    </g>
    <rect x="14" y="158" width="70" height="3" rx="1.5" fill="rgba(34,211,238,0.35)"/>
    <rect x="14" y="158" width="58" height="3" rx="1.5" fill="#22d3ee"/>
  </g>
</svg>
