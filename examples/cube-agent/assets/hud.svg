<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150">
  <style>
    .chip-pulse {
      animation: chippulse 2.2s ease-in-out infinite;
    }
    .chip-pulse.c2 { animation-delay: 0.5s; }
    .chip-pulse.c3 { animation-delay: 1.1s; }
    @keyframes chippulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    .eqbar {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: eqdance 0.9s ease-in-out infinite;
    }
    .eqbar.e2 { animation-delay: 0.15s; }
    .eqbar.e3 { animation-delay: 0.3s; }
    .eqbar.e4 { animation-delay: 0.45s; }
    @keyframes eqdance {
      0%, 100% { transform: scaleY(0.3); }
      50%      { transform: scaleY(1); }
    }
  </style>
  <defs>
    <linearGradient id="hudbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(12,20,34,0.88)"/>
      <stop offset="1" stop-color="rgba(7,12,22,0.9)"/>
    </linearGradient>
    <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(34,211,238,0.35)"/>
      <stop offset="1" stop-color="rgba(34,211,238,0)"/>
    </linearGradient>
  </defs>
  <g id="card">
    <rect width="300" height="150" rx="14" fill="url(#hudbg)"
          stroke="rgba(34,211,238,0.3)"/>
    <rect x="0" y="0" width="300" height="22" rx="14" fill="rgba(34,211,238,0.08)"/>
    <text x="16" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#5f7d9c" letter-spacing="2">CU-13 // TELEMETRY</text>
    <circle cx="285" cy="11" r="4" fill="#34d399"/>
    <circle cx="285" cy="11" r="4" fill="none" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="r" values="4;9" dur="1.6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite" begin="0s"/>
    </circle>

    <text x="16" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#5f7d9c" letter-spacing="3">STATE</text>
    <text id="state-label" data-as-text="true" x="16" y="66"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="22" fill="#22d3ee">idle</text>

    <text x="196" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#5f7d9c" letter-spacing="1">MSGS</text>
    <text id="count-msgs" x="196" y="60"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#dbe7f3">0</text>
    <text x="252" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#5f7d9c" letter-spacing="1">OPS</text>
    <text id="count-ops" x="252" y="60"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#dbe7f3">0</text>

    <g id="chips">
      <g class="chip-pulse">
        <rect x="16" y="78" width="58" height="17" rx="8.5" fill="rgba(52,211,153,0.12)"
              stroke="rgba(52,211,153,0.5)"/>
        <text x="45" y="90" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="9" fill="#34d399">60 FPS</text>
      </g>
      <g class="chip-pulse c2">
        <rect x="80" y="78" width="58" height="17" rx="8.5" fill="rgba(34,211,238,0.12)"
              stroke="rgba(34,211,238,0.5)"/>
        <text x="109" y="90" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="9" fill="#22d3ee">SYNC</text>
      </g>
      <g class="chip-pulse c3">
        <rect x="144" y="78" width="52" height="17" rx="8.5" fill="rgba(251,191,36,0.1)"
              stroke="rgba(251,191,36,0.45)"/>
        <text x="170" y="90" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="9" fill="#fbbf24">v2.3</text>
      </g>
      <!-- equalizer bars (pack-driven group opacity, CSS-driven bar dance) -->
      <g id="eq" opacity="0.9">
        <rect class="eqbar"    x="206" y="76" width="7" height="19" rx="2" fill="#22d3ee"/>
        <rect class="eqbar e2" x="216" y="76" width="7" height="19" rx="2" fill="#22d3ee"/>
        <rect class="eqbar e3" x="226" y="76" width="7" height="19" rx="2" fill="#22d3ee"/>
        <rect class="eqbar e4" x="236" y="76" width="7" height="19" rx="2" fill="#22d3ee"/>
      </g>
    </g>

    <polygon id="spark-fill" fill="url(#sparkfill)" opacity="0.8"
             points="16,136 284,136"/>
    <polyline id="spark" fill="none" stroke="#22d3ee" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round" opacity="0.9"
              points="16,136 284,136"/>
  </g>
  <g id="rec" opacity="0">
    <text x="258" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#f43f5e" text-anchor="end" letter-spacing="2">REC</text>
    <circle cx="266" cy="129" r="5" fill="#f43f5e">
      <animate attributeName="opacity" values="1;0.25;1" dur="1s" repeatCount="indefinite" begin="0s"/>
    </circle>
  </g>
</svg>
