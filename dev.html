<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Agent Stage — dev harness</title>
<style>
  :root { color-scheme: dark; }
  body { background:#0b0f14; color:#dfe7ef; font-family:system-ui,sans-serif; margin:0; }
  header { padding:12px 20px; font-size:14px; color:#8aa0b4; }
  #stage { position:relative; width:900px; height:520px; margin:0 20px;
           border:1px solid #1e2a36; border-radius:8px; }
  #controls { display:flex; gap:14px; align-items:center; padding:14px 20px; flex-wrap:wrap; }
  button { background:#16222e; color:#dfe7ef; border:1px solid #2c4156;
           border-radius:6px; padding:8px 16px; cursor:pointer; font-size:14px; }
  button:hover { background:#1f3040; }
  label { font-size:13px; color:#8aa0b4; display:flex; align-items:center; gap:8px; }
  input[type=range] { width:220px; }
  #seekVal, #rateVal { min-width:52px; color:#4ff2c3; font-variant-numeric:tabular-nums; }
  #status { padding:0 20px 14px; font-size:12px; color:#6f8ba3; min-height:18px; }
  #status b { color:#4ff2c3; font-weight:600; }
  #err { display:none; margin:0 20px 14px; padding:10px 14px; font:12px/1.5 ui-monospace,monospace;
         color:#ffb4b4; background:#2a1114; border:1px solid #7a2b31; border-radius:8px; white-space:pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "agent-stage/": "./src/"
  }
}
</script>
</head>
<body>
<header>Agent Stage Phase 2 — Registry packs · AgentDriver channels · AnchorBridge · TextureBridge</header>
<div id="err"></div>
<div id="stage"></div>
<div id="controls">
  <button id="btnPlay">Play</button>
  <button id="btnPause">Pause</button>
  <button id="btnStop">Stop</button>
  <button id="btnSmile">Smile (SMIL trigger)</button>
  <button id="btnGreet">Greet</button>
  <button id="btnThink">Think (state on/off)</button>
  <button id="btnEmote">Emote (queue x2)</button>
  <button id="btnFade">Crossfade demo</button>
  <button id="btnSay">Say hi</button>
  <label>Seek <input id="seek" type="range" min="0" max="4" step="0.01" value="0"/> <span id="seekVal">0.00s</span></label>
  <label>Rate <input id="rate" type="range" min="0.25" max="3" step="0.05" value="1"/> <span id="rateVal">1.00x</span></label>
</div>
<div id="status">ready</div>

<script>
  // Surface module/page errors visibly — an empty stage must never be a mystery.
  window.addEventListener('error', (e) => showErr(e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => showErr(e.reason));
  function showErr(err) {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = (err && err.stack) ? String(err.stack) : String(err);
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { createAgentStage } from 'agent-stage/index.js';

  const res = createAgentStage({ mount: '#stage', stageOptions: { antialias: true, alpha: true } });
  const { stage, timeline, threeLayer, svgLayer, engines, ctx, registry, driver, anchorBridge, textureBridge } = res;
  const { prop, waapi, smil } = engines;
  const status = document.getElementById('status');
  const note = (s) => { status.innerHTML = s; };
  ['play','pause','stop','finished','queue-empty'].forEach((ev) =>
    driver.on(ev, ({pack, channel}) => note(`driver <b>${ev}</b> pack=${pack} channel=${channel}`)));

  // --- scene ---
  stage.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(2, 3, 4);
  stage.scene.add(dirLight);
  stage.camera.position.set(0, 1.2, 5);
  stage.camera.lookAt(0, 0, 0);

  // --- registry: named assets (nothing mounted until instantiate) ---
  registry.registerAsset('svg', 'face', './assets/svg/dev-face.svg');
  registry.registerAsset('svg', 'nametag', `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <rect x="2" y="2" width="136" height="36" rx="10" fill="#16222e" stroke="#3fa9f5" stroke-width="2"/>
  <g id="tag">
    <text data-as-text="true" x="70" y="25" text-anchor="middle" fill="#4ff2c3"
          font-size="14" font-family="ui-monospace,monospace">AGENT-01</text>
  </g>
</svg>`);
  registry.registerAsset('three', 'body', () => new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 1.4, 1.4),
    new THREE.MeshStandardMaterial({ color: 0x3fa9f5, roughness: 0.35 })
  ));
  registry.registerAsset('three', 'screen', () => new THREE.Mesh(
    new THREE.PlaneGeometry(0.9, 0.9),
    new THREE.MeshBasicMaterial({ color: 0x4ff2c3, transparent: true, opacity: 0.95 })
  ));

  // --- registry: named packs (the AI-facing JSON format) ---
  registry.registerPacks([
    { // multi-track: cube bow + mouth WAAPI + SMIL smile trigger
      name: 'greet', channel: 'body', duration: 2.0, loop: false,
      tracks: [
        { engine: 'prop', target: 'body',
          props: {
            'rotation:x': [
              { t: 0, v: 0 }, { t: 0.5, v: -0.45, ease: 'easeOutQuad' },
              { t: 1.0, v: -0.45 }, { t: 2.0, v: 0, ease: 'easeInOutQuad' }],
            'position:z': [
              { t: 0, v: 0 }, { t: 0.5, v: 0.7, ease: 'easeOutQuad' },
              { t: 1.0, v: 0.7 }, { t: 2.0, v: 0, ease: 'easeInOutQuad' }]
          } },
        { engine: 'waapi', svg: 'face', selector: '#mouth',
          keyframes: [
            { t: 0, opacity: 1 }, { t: 0.3, opacity: 0.25 },
            { t: 1.0, opacity: 1 }, { t: 1.4, opacity: 0.25 }, { t: 2.0, opacity: 1 }],
          options: { fill: 'both' } },
        { engine: 'smil', svg: 'face', mode: 'trigger', animation: 'smile', begin: 0.2 }
      ]
    },
    { // looping state: eyes pulse + screen sway
      name: 'think', channel: 'state', loop: 'repeat',
      tracks: [
        { engine: 'waapi', svg: 'face', selector: '#eyeR', loop: 'repeat',
          keyframes: [
            { t: 0, opacity: 1 }, { t: 0.6, opacity: 0.15 }, { t: 1.2, opacity: 1 }],
          options: { fill: 'both' } },
        { engine: 'prop', target: 'screen', loop: 'repeat',
          props: { 'rotation:z': [
            { t: 0, v: 0 }, { t: 1.0, v: 0.1, ease: 'easeInOutQuad' },
            { t: 2.0, v: -0.1, ease: 'easeInOutQuad' }, { t: 3.0, v: 0 }] } }
      ]
    },
    { name: 'emote-wink', channel: 'face',
      tracks: [
        { engine: 'waapi', svg: 'face', selector: '#eyeR',
          keyframes: [
            { t: 0, transform: 'scaleY(1)' }, { t: 0.2, transform: 'scaleY(0.05)' },
            { t: 0.4, transform: 'scaleY(1)' }, { t: 0.6, transform: 'scaleY(0.05)' },
            { t: 0.8, transform: 'scaleY(1)' }],
          options: { fill: 'both' } }] },
    { name: 'emote-wow', channel: 'face',
      tracks: [
        { engine: 'waapi', svg: 'face', selector: '#eyeL',
          keyframes: [
            { t: 0, transform: 'scale(1)' }, { t: 0.3, transform: 'scale(1.7)', ease: 'backOut' },
            { t: 0.8, transform: 'scale(1)' }],
          options: { fill: 'both' } }] },
    { name: 'fx-in', channel: 'fx',
      tracks: [{ engine: 'waapi', svg: 'nametag', selector: '#tag',
        keyframes: [{ t: 0, opacity: 0.1 }, { t: 1, opacity: 1, ease: 'easeOutCubic' }] }] },
    { name: 'fx-out', channel: 'fx',
      tracks: [{ engine: 'waapi', svg: 'nametag', selector: '#tag',
        keyframes: [{ t: 0, opacity: 1 }, { t: 1, opacity: 0.1, ease: 'easeOutCubic' }] }] },
    { // slow drift so the anchored nametag visibly tracks the cube
      name: 'drift', channel: 'drift', loop: 'pingpong',
      tracks: [{ engine: 'prop', target: 'body',
        props: { 'position:x': [ { t: 0, v: -0.9 }, { t: 4, v: 0.9, ease: 'easeInOutQuad' } ] } }] },
    { // speak: declares where AgentDriver.say() writes text
      name: 'speak', channel: 'speak',
      text: { svg: 'nametag', selector: '[data-as-text]' },
      tracks: [{ engine: 'waapi', svg: 'face', selector: '#mouth', loop: 'repeat',
        keyframes: [
          { t: 0, transform: 'translateY(0px)' }, { t: 0.15, transform: 'translateY(5px)' },
          { t: 0.3, transform: 'translateY(0px)' }],
        options: { fill: 'both' } }] },
  ]);

  // --- mount + compile ---
  await registry.instantiate(stage);
  await registry.compileAll(ctx);

  const body = threeLayer.get('body');
  const screen = threeLayer.get('screen');
  screen.position.set(0, 0, 0.72);

  // keep SMIL doc clock following the timeline (phase 1 behavior)
  svgLayer.pause('face');

  // --- live texture: the dev face rendered ONTO the 3D screen plane ---
  textureBridge.bind('face', screen, { width: 256, fps: 30 });

  // --- world-anchored name tag above the cube ---
  anchorBridge.anchor('nametag', { target: 'body', offset: { x: 0, y: 1.15, z: 0 }, anchor: 'bottom' });

  // --- Phase 1 demo tracks (unchanged behavior) ---
  const spinTrack = timeline.add(prop.compile({
    engine: 'prop', target: 'body', loop: 'repeat',
    props: {
      'rotation:y': [
        { t: 0, v: 0 }, { t: 1.0, v: 0.6, ease: 'easeOutCubic' },
        { t: 2.0, v: 1.2, ease: 'easeInQuad' }, { t: 3.0, v: Math.PI * 2, ease: 'linear' }],
      'position:y': [ { t: 0, v: 0 }, { t: 1.5, v: 0.35, ease: 'easeInOutQuad' }, { t: 3.0, v: 0 } ]
    }
  }), { begin: 0 });

  const bobTrack = timeline.add(prop.compile({
    engine: 'prop', target: 'screen',
    props: { 'position:y': [
      { t: 0, v: 0 }, { t: 0.75, v: 0.5, ease: 'easeOutCubic' }, { t: 1.5, v: 0, ease: 'easeInQuad' },
      { t: 2.25, v: 0.5, ease: 'easeOutCubic' }, { t: 3.0, v: 0 }] }
  }), { begin: 0 });

  const mouthTrack = timeline.add(waapi.compile({
    engine: 'waapi', svg: 'face', selector: '#mouth',
    keyframes: [
      { t: 0, opacity: 1, transform: 'translateY(0px)' },
      { t: 0.6, opacity: 0.35, transform: 'translateY(4px)', ease: 'easeOutQuad' },
      { t: 1.2, opacity: 1, transform: 'translateY(0px)', ease: 'easeOutCubic' },
      { t: 1.8, opacity: 0.35, transform: 'translateY(4px)', ease: 'easeOutQuad' },
      { t: 2.4, opacity: 1, transform: 'translateY(0px)' }],    options: { fill: 'both' }
  }), { begin: 0.6 });

  const smileTrack = timeline.add(smil.compile({
    engine: 'smil', svg: 'face', mode: 'trigger', animation: 'smile'
  }));

  // --- driver channels ---
  driver.play('drift');                       // 'drift' channel: cube drifts, nametag follows

  timeline.seek(0);
  timeline.play();

  // --- Controls ---
  const seek = document.getElementById('seek');
  const seekVal = document.getElementById('seekVal');
  const rate = document.getElementById('rate');
  const rateVal = document.getElementById('rateVal');
  let dragging = false;

  seek.addEventListener('input', () => {
    dragging = true;
    const t = parseFloat(seek.value);
    seekVal.textContent = t.toFixed(2) + 's';
    timeline.seek(t);
  });
  seek.addEventListener('change', () => { dragging = false; });
  rate.addEventListener('input', () => {
    const r = parseFloat(rate.value);
    rateVal.textContent = r.toFixed(2) + 'x';
    timeline.setRate(r);
  });

  document.getElementById('btnPlay').addEventListener('click', () => timeline.play());
  document.getElementById('btnPause').addEventListener('click', () => timeline.pause());
  document.getElementById('btnStop').addEventListener('click', () => {
    driver.stop('all');
    timeline.stopAll();
    spinTrack.playing = bobTrack.playing = mouthTrack.playing = false;
    timeline.seek(0);
    timeline.play();
    driver.play('drift');
  });
  document.getElementById('btnSmile').addEventListener('click', () => smileTrack.play());
  document.getElementById('btnGreet').addEventListener('click', () => driver.play('greet'));
  document.getElementById('btnThink').addEventListener('click', () => {
    const on = driver.isPlaying('state');
    driver.state('think', !on);
    note(on ? 'think <b>off</b>' : 'think <b>on</b> (looping state pack, interruptible)');
  });
  document.getElementById('btnEmote').addEventListener('click', () => {
    driver.play('emote-wink', { channel: 'face', blend: 'queue' });
    driver.play('emote-wow', { channel: 'face', blend: 'queue' });
  });
  document.getElementById('btnFade').addEventListener('click', () => {
    driver.play('fx-in', { channel: 'fx' });
    driver.play('fx-out', { channel: 'fx', blend: 'crossfade', fadeTime: 0.3 });
  });
  document.getElementById('btnSay').addEventListener('click', () => {
    driver.say('Hello, human!', { pack: 'speak' });
  });

  stage.on('tick', ({ time }) => {
    if (!dragging) {
      seek.max = String(Math.max(4, timeline.duration));
      seek.value = String(time % 4);
      seekVal.textContent = (time % 4).toFixed(2) + 's';
    }
  });
</script>
</body>
</html>
