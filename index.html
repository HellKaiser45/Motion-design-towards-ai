<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Agent Stage — Motion Review</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e14;
    --panel: rgba(16, 26, 44, 0.7);
    --panel-border: rgba(34, 211, 238, 0.14);
    --text: #d7e2ee;
    --muted: #7b8fa5;
    --accent: #22d3ee;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 22px;
    background: rgba(10, 18, 30, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border);
    flex: none;
  }
  .wordmark {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
    white-space: nowrap;
  }
  .wordmark .dot { color: var(--muted); }
  #status-line {
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  #status-line b { color: var(--text); font-weight: 600; }
  #dev-link {
    margin-left: auto;
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: none;
    padding: 5px 12px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: var(--panel);
  }
  #dev-link:hover { color: var(--accent); border-color: rgba(34,211,238,.4); }

  #layout { display: flex; flex: 1; min-height: 0; }

  /* ---- sidebar ---- */
  aside {
    width: 300px;
    flex: none;
    border-right: 1px solid var(--panel-border);
    overflow-y: auto;
    padding: 14px 12px 24px;
  }
  .side-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 8px 10px;
  }
  .sub {
    padding: 12px 12px 11px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: var(--panel);
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .sub:hover { border-color: rgba(34,211,238,.3); }
  .sub.active {
    border-color: rgba(34,211,238,.55);
    background: rgba(34, 211, 238, 0.09);
  }
  .sub .t { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .sub .row { display: flex; align-items: center; gap: 7px; margin-top: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(34,211,238,.35);
    color: var(--accent);
    letter-spacing: .04em;
  }
  .chip.author { border-color: rgba(123,143,165,.4); color: var(--muted); }
  .badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .badge.approved { color: #0a1a0e; background: var(--green); }
  .badge.changes  { color: #1a1204; background: var(--amber); }
  .badge.rejected { color: #fff; background: var(--red); }
  .sub .note {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 7px;
    line-height: 1.45;
  }

  /* ---- main ---- */
  main { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 28px 40px; }
  .player-wrap {
    position: relative;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    background: #05080d;
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    overflow: hidden;
  }
  .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #05080d; }
  #banner {
    position: absolute;
    left: 0; right: 0; top: 0;
    display: none;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.5;
    background: rgba(122, 23, 30, 0.92);
    border-bottom: 1px solid rgba(239,68,68,.6);
    color: #ffd9d9;
    z-index: 2;
  }
  #banner a { color: #fff; }

  .sub-title { max-width: 980px; margin: 14px auto 0; font-size: 14px; color: var(--muted); }
  .sub-title b { color: var(--text); }

  /* ---- transport ---- */
  #transport {
    max-width: 980px;
    margin: 16px auto 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    flex-wrap: wrap;
  }
  #transport.disabled { opacity: .45; }
  button.t {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: rgba(34, 211, 238, 0.12);
    border: 1px solid rgba(34, 211, 238, 0.4);
    border-radius: 9px;
    padding: 8px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.t:hover { background: rgba(34, 211, 238, 0.22); }
  #btn-play {
    padding: 9px 26px;
    background: rgba(34, 211, 238, 0.2);
    font-size: 14px;
  }
  #scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
  #time-readout {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--accent);
    min-width: 108px;
    text-align: right;
  }
  #hint-external { flex: 1; font-size: 13px; color: var(--muted); }

  /* ---- verdict ---- */
  #verdict-panel {
    max-width: 980px;
    margin: 18px auto 0;
    padding: 18px 20px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
  }
  #verdict-panel h2 { margin: 0 0 14px; font-size: 14px; font-weight: 600; color: var(--muted); }
  #verdict-panel h2 b { color: var(--text); }
  .v-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .v-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 9px 20px;
    cursor: pointer;
    opacity: .55;
    transition: opacity .15s;
  }
  .v-btn:hover { opacity: .85; }
  .v-btn.selected { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px currentColor; }
  #v-approve { background: var(--green); color: #0a1a0e; }
  #v-changes { background: var(--amber); color: #1a1204; }
  #v-reject  { background: var(--red); }
  #v-note {
    display: block;
    width: 100%;
    margin-top: 14px;
    min-height: 88px;
    resize: vertical;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    background: rgba(5, 8, 13, 0.6);
    border: 1px solid rgba(123,143,165,.3);
    border-radius: 10px;
    padding: 10px 12px;
  }
  #v-note:focus { outline: none; border-color: rgba(34,211,238,.5); }
  #v-note::placeholder { color: #55697e; }
  .v-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  #v-save {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: #062330;
    background: var(--accent);
    border: 0;
    border-radius: 9px;
    padding: 9px 24px;
    cursor: pointer;
  }
  #v-save:hover { filter: brightness(1.1); }
  #v-saved-at { font-size: 12px; color: var(--muted); }
  #export-bar { margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .x-btn {
    font-family: inherit;
    font-size: 12px;
    color: var(--muted);
    background: rgba(5,8,13,.6);
    border: 1px solid rgba(123,143,165,.3);
    border-radius: 8px;
    padding: 6px 13px;
    cursor: pointer;
  }
  .x-btn:hover { color: var(--accent); border-color: rgba(34,211,238,.4); }
  #export-hint { font-size: 11.5px; color: #55697e; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <div class="wordmark">AGENT-STAGE <span class="dot">·</span> MOTION REVIEW</div>
  <div id="status-line"></div>
  <a id="dev-link" href="dev.html">dev harness →</a>
</header>

<div id="layout">
  <aside>
    <div class="side-label">Submissions</div>
    <div id="sub-list"></div>
  </aside>

  <main>
    <div class="player-wrap">
      <div id="banner"></div>
      <iframe id="player" title="submission player"></iframe>
    </div>
    <div class="sub-title" id="sub-title"></div>

    <div id="transport">
      <button class="t" id="btn-play">Play</button>
      <button class="t" id="btn-restart">Restart</button>
      <input id="scrub" type="range" min="0" max="10" step="0.01" value="0"/>
      <span id="time-readout">0.00 / 0.00 s</span>
      <button class="t" id="btn-loop">Loop: on</button>
    </div>

    <div id="verdict-panel">
      <h2>Your verdict on <b id="v-target">—</b></h2>
      <div class="v-buttons">
        <button class="v-btn" id="v-approve">Approve</button>
        <button class="v-btn" id="v-changes">Request changes</button>
        <button class="v-btn" id="v-reject">Reject</button>
      </div>
      <textarea id="v-note" placeholder="what worked / what to fix — the agent reads this"></textarea>
      <div class="v-actions">
        <button id="v-save">Save verdict</button>
        <span id="v-saved-at"></span>
        <span id="export-bar">
          <button class="x-btn" id="btn-copy">Copy JSON</button>
          <button class="x-btn" id="btn-download">Download verdicts.json</button>
        </span>
        <span id="export-hint">agents read verdicts at /?verdicts=1</span>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  // ---------------- verdicts=1 machine endpoint ----------------
  var STORAGE_KEY = 'agent-stage:verdicts';
  function loadVerdicts() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  if (new URLSearchParams(location.search).has('verdicts')) {
    var pre = document.createElement('pre');
    pre.style.cssText =
      'background:#0a0e14;color:#d7e2ee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;' +
      'font-size:13px;line-height:1.6;padding:24px;margin:0;min-height:100vh;white-space:pre-wrap;';
    pre.textContent = JSON.stringify(loadVerdicts(), null, 2);
    document.body.textContent = '';
    document.body.appendChild(pre);
    return;
  }

  // ---------------- state ----------------
  var entries = [];
  var current = null;
  var selectedId = null;
  var ready = false;
  var readyTimer = null;
  var duration = 0;          // from manifest until 'ready', then from child
  var playing = false;
  var loopOn = true;
  var scrubbing = false;
  var pendingVerdict = null; // { verdict } selection in panel, unsaved

  var $ = function (id) { return document.getElementById(id); };
  var iframe = $('player');
  var banner = $('banner');
  var scrub = $('scrub');
  var readout = $('time-readout');
  var btnPlay = $('btn-play');
  var btnRestart = $('btn-restart');
  var btnLoop = $('btn-loop');
  var transport = $('transport');

  function post(msg) {
    if (!current || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage(msg, '*');
  }

  function fmt(n) { return n.toFixed(2); }
  function updateReadout() { readout.textContent = fmt(parseFloat(scrub.value)) + ' / ' + fmt(duration) + ' s'; }

  function showBanner(html) {
    banner.innerHTML = html;
    banner.style.display = 'block';
  }
  function clearBanner() { banner.style.display = 'none'; banner.innerHTML = ''; }

  // ---------------- counts ----------------
  function updateCounts() {
    var v = loadVerdicts();
    var approved = 0, pending = 0, other = 0;
    entries.forEach(function (e) {
      var vd = v[e.id] && v[e.id].verdict;
      if (vd === 'approved') approved++;
      else if (vd) other++;
      else pending++;
    });
    $('status-line').innerHTML =
      entries.length + ' submissions · <b>' + approved + ' approved</b> · ' + pending + ' pending' +
      (other ? ' · ' + other + ' changes/rejected' : '');
  }

  function badgeFor(id) {
    var v = loadVerdicts();
    var vd = v[id] && v[id].verdict;
    if (!vd) return '';
    var label = vd === 'approved' ? 'APPROVED' : vd === 'changes' ? 'CHANGES' : 'REJECTED';
    return '<span class="badge ' + vd + '">' + label + '</span>';
  }

  // ---------------- sidebar ----------------
  function renderSidebar() {
    var list = $('sub-list');
    list.innerHTML = '';
    entries.forEach(function (e) {
      var el = document.createElement('div');
      el.className = 'sub' + (e.id === selectedId ? ' active' : '');
      el.innerHTML =
        '<div class="t"></div>' +
        '<div class="row"><span class="chip author"></span><span class="chip kind"></span>' + badgeFor(e.id) + '</div>' +
        '<div class="note"></div>';
      el.querySelector('.t').textContent = e.title;
      el.querySelector('.chip.author').textContent = e.author;
      el.querySelector('.chip.kind').textContent = e.kind;
      el.querySelector('.note').textContent = e.note || '';
      el.addEventListener('click', function () { select(e); });
      list.appendChild(el);
    });
    updateCounts();
  }

  // ---------------- player / selection ----------------
  function select(entry) {
    selectedId = entry.id;
    current = entry;
    ready = false;
    playing = false;
    duration = (entry.kind === 'kit' && typeof entry.duration === 'number') ? entry.duration : 0;
    scrub.value = '0';
    scrub.max = String(Math.max(0.01, duration));
    updateReadout();
    btnPlay.textContent = 'Play';
    clearBanner();

    renderSidebar();
    $('sub-title').innerHTML = 'Now reviewing: <b>' + esc(entry.title) + '</b>' +
      (entry.kind === 'external' ? ' <span style="color:#55697e">(external)</span>' : '');

    // verdict panel
    $('v-target').textContent = entry.title;
    var saved = loadVerdicts()[entry.id] || null;
    pendingVerdict = saved ? saved.verdict : null;
    setVerdictButtons(pendingVerdict);
    $('v-note').value = saved ? saved.note : '';
    $('v-saved-at').textContent = saved ? ('saved ' + new Date(saved.at).toLocaleString()) : '';

    // transport
    var kit = entry.kind === 'kit';
    transport.classList.toggle('disabled', !kit);
    for (var i = 0; i < transport.children.length; i++) transport.children[i].disabled = !kit;
    $('time-readout').style.display = kit ? '' : 'none';
    var hintEl = $('hint-external');
    if (hintEl) hintEl.remove();
    if (!kit) {
      var hint = document.createElement('span');
      hint.id = 'hint-external';
      hint.textContent = 'interactive demo — use its own controls';
      transport.appendChild(hint);
    }

    // iframe
    var join = entry.src.indexOf('?') >= 0 ? '&' : '?';
    readyTimer = setTimeout(function () {
      if (!ready) {
        showBanner('⚠ submission did not initialize within 8 s — the kit may be missing or not speaking the review protocol.');
      }
    }, 8000);
    iframe.src = entry.src + join + 'review=1';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;' }[c];
    });
  }

  // ---------------- transport ----------------
  btnPlay.addEventListener('click', function () {
    if (playing) { post({ type: 'pause' }); playing = false; btnPlay.textContent = 'Play'; }
    else { post({ type: 'play' }); playing = true; btnPlay.textContent = 'Pause'; }
  });
  btnRestart.addEventListener('click', function () {
    post({ type: 'restart' });
    scrub.value = '0'; updateReadout();
    playing = true; btnPlay.textContent = 'Pause';
  });
  btnLoop.addEventListener('click', function () {
    loopOn = !loopOn;
    btnLoop.textContent = 'Loop: ' + (loopOn ? 'on' : 'off');
    post({ type: 'loop', on: loopOn });
  });
  scrub.addEventListener('input', function () {
    scrubbing = true;
    post({ type: 'seek', t: parseFloat(scrub.value) });
    updateReadout();
  });
  scrub.addEventListener('change', function () {
    scrubbing = false;
    post({ type: 'seek', t: parseFloat(scrub.value) });
    updateReadout();
  });

  // ---------------- verdict panel ----------------
  function setVerdictButtons(v) {
    ['approve', 'changes', 'reject'].forEach(function (k) {
      var key = k === 'reject' ? 'rejected' : k;
      $('v-' + k).classList.toggle('selected', v === key);
    });
  }
  ['approve', 'changes', 'reject'].forEach(function (k) {
    $('v-' + k).addEventListener('click', function () {
      var key = k === 'reject' ? 'rejected' : k;
      pendingVerdict = (pendingVerdict === key) ? null : key;
      setVerdictButtons(pendingVerdict);
    });
  });
  $('v-save').addEventListener('click', function () {
    if (!current) return;
    var all = loadVerdicts();
    if (pendingVerdict) {
      all[current.id] = {
        verdict: pendingVerdict,
        note: $('v-note').value,
        at: new Date().toISOString()
      };
    } else {
      delete all[current.id];
    }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); } catch (e) {}
    $('v-saved-at').textContent = pendingVerdict
      ? ('saved ' + new Date(all[current.id].at).toLocaleString()) : 'cleared';
    renderSidebar();
  });

  // ---------------- export ----------------
  $('btn-copy').addEventListener('click', function () {
    var text = JSON.stringify(loadVerdicts(), null, 2);
    var done = function () {
      $('btn-copy').textContent = 'Copied ✓';
      setTimeout(function () { $('btn-copy').textContent = 'Copy JSON'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); done();
    }
  });
  $('btn-download').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(loadVerdicts(), null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'verdicts.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });

  // ---------------- postMessage protocol ----------------
  window.addEventListener('message', function (ev) {
    if (!current) return;
    var src = ev.source;
    if (src && iframe.contentWindow && src !== iframe.contentWindow) return;
    var m = ev.data || {};
    switch (m.type) {
      case 'ready':
        ready = true;
        clearTimeout(readyTimer);
        clearBanner();
        if (typeof m.duration === 'number' && m.duration > 0) {
          duration = m.duration;
          scrub.max = String(duration);
        }
        updateReadout();
        post({ type: 'loop', on: loopOn });
        break;
      case 'time':
        if (!scrubbing && typeof m.t === 'number') {
          scrub.value = String(m.t);
          updateReadout();
        }
        break;
      case 'ended':
        playing = false;
        btnPlay.textContent = 'Play';
        break;
      case 'error':
        showBanner('✕ <b>submission error</b> — ' + esc(m.message || 'unknown') +
          ' &nbsp; <a href="' + esc(current.src) + '" target="_blank" rel="noopener">Open standalone ↗</a>');
        break;
    }
  });

  // ---------------- boot ----------------
  fetch('review/manifest.json')
    .then(function (r) { return r.json(); })
    .then(function (m) {
      entries = m.submissions || [];
      renderSidebar();
      if (entries.length) select(entries[0]);
      else showBanner('manifest has no submissions');
    })
    .catch(function (err) {
      $('sub-list').innerHTML = '<div style="color:#ef4444;font-size:13px;padding:8px">failed to load review/manifest.json</div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
